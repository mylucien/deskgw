name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      release:
        description: '手动触发时是否发布 Release'
        type: boolean
        default: false
      gensum:
        description: '生成并提交 go.sum（仅用于初始化依赖）'
        type: boolean
        default: false

permissions:
  contents: write

env:
  GOFLAGS: -mod=readonly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gensum:
    name: 生成 go.sum
    if: github.event_name == 'workflow_dispatch' && inputs.gensum
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: go mod tidy 并提交
        env:
          GOFLAGS: ''
        run: |
          set -e
          go mod tidy
          git config user.name 'deskgw-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add go.mod go.sum
          git diff --cached --quiet || git commit -m 'chore: 生成 go.sum'
          git push origin HEAD:main

  prepare:
    name: 读取版本
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      short: ${{ steps.v.outputs.short }}
    steps:
      - uses: actions/checkout@v4
      - name: 解析版本号
        id: v
        run: |
          set -e
          version=$(sed -n 's/^PKG_VERSION:=//p' openwrt/Makefile | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version"

  lint:
    name: 静态检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Go 静态检查
        run: go vet ./...
      - name: Go 单元测试
        run: go test ./...
      - name: gofmt
        run: |
          set -e
          files=$(git ls-files '*.go')
          out=$(gofmt -l $files)
          if [ -n "$out" ]; then
            echo "::error::以下 Go 文件未格式化（执行 gofmt -w 后提交）"
            echo "$out"
            gofmt -d $out | head -200
            exit 1
          fi
      - name: 版本一致性
        run: |
          set -e
          pkg=$(sed -n 's/^PKG_VERSION:=//p' openwrt/Makefile | head -1)
          api=$(sed -n 's/^const serverVersion = "\(.*\)"/\1/p' internal/api/api.go | head -1)
          echo "openwrt/Makefile=$pkg internal/api=$api"
          [ -n "$pkg" ] && [ "$pkg" = "$api" ] || {
            echo "::error::PKG_VERSION 与 serverVersion 不一致"; exit 1; }
      - name: shell 语法
        run: |
          set -e
          for f in scripts/*.sh openwrt/files/etc/init.d/* \
                   openwrt/files/etc/uci-defaults/* \
                   openwrt/files/usr/libexec/deskgw/*; do
            echo "sh -n $f"; sh -n "$f"
          done
      - name: JSON 语法
        run: |
          set -e
          for f in $(git ls-files '*.json'); do echo "jq $f"; jq empty "$f"; done
      - name: LuCI 视图语法
        run: |
          set -e
          for f in $(git ls-files '*.js'); do
            echo "check $f"
            node -e 'new Function(require("fs").readFileSync(process.argv[1],"utf8"))' "$f"
          done
      - name: Python 语法
        run: python3 -m py_compile scripts/rdp-tunnel-test.py

  wasm:
    name: 构建 WASM（IronRDP 0.17.0）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
          key: simd128
      - name: 安装 wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: 从 vendored 官方源码构建
        working-directory: wasm
        env:
          # 解码（RemoteFX / 位图 RLE）是浏览器里最重的一段，全靠标量代码会明显拖慢帧率。
          RUSTFLAGS: -C target-feature=+simd128
        run: |
          wasm-pack build ironrdp-web --release --target web \
            --out-dir ../../web/src/wasm/pkg --out-name ironrdp_web
      - name: 校验产物（含 SIMD）
        run: |
          set -e
          ls -l web/src/wasm/pkg
          [ -f web/src/wasm/pkg/ironrdp_web_bg.wasm ] || { echo "::error::缺少 wasm 产物"; exit 1; }
          # simd128 会把目标特性写进 wasm 的 target_features 段，用它确认标志生效。
          python3 -c '
          data = open("web/src/wasm/pkg/ironrdp_web_bg.wasm", "rb").read()
          print("wasm size:", len(data))
          print("target_feature simd128:", b"simd128" in data)
          '
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg
          if-no-files-found: error

  ui:
    name: 构建前端
    needs: [ wasm ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: npm run build
        working-directory: web
        run: npm run build
      - name: 打包 dist
        run: tar czf web-dist.tar.gz -C web/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          if-no-files-found: error

  binaries:
    name: 编译 ${{ matrix.arch }}
    needs: [ prepare, lint, ui ]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            goarch: amd64
          - arch: aarch64_cortex-a53
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dl
      - name: 放入前端产物
        run: tar xzf dl/web-dist.tar.gz -C web/dist
      - name: 静态交叉编译
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -e
          mkdir -p out
          go build -trimpath -ldflags '-s -w' -o out/deskgw ./cmd/deskgw
          file out/deskgw
          if readelf -l out/deskgw 2>/dev/null | grep -q INTERP; then
            echo "::error::deskgw 不是静态二进制"; exit 1
          fi
      - name: 打预编译包
        run: |
          set -e
          rm -rf rel && mkdir -p rel
          cp out/deskgw rel/
          tar czf "deskgw-${{ matrix.arch }}.tar.gz" -C rel .
          cd out && sha256sum deskgw > ../deskgw-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: |
            deskgw-${{ matrix.arch }}.tar.gz
            deskgw-${{ matrix.arch }}.sha256
          if-no-files-found: error

  package:
    name: 打包 ipk ${{ matrix.arch }}
    needs: [ prepare, binaries ]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64, aarch64_cortex-a53 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: dl
      - name: 展开二进制
        run: |
          set -e
          mkdir -p bin dist
          tar xzf "dl/deskgw-${{ matrix.arch }}.tar.gz" -C bin
          cp "dl/deskgw-${{ matrix.arch }}.tar.gz" dist/
          cp "dl/deskgw-${{ matrix.arch }}.sha256" dist/
      - name: 打包 ipk
        run: |
          set -e
          sh scripts/package-ipk.sh "${{ matrix.arch }}" bin \
            "${{ needs.prepare.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  smoke:
    name: 冒烟测试（x86_64 实机运行）
    needs: [ package ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipk-x86_64
          path: dl
      - run: mkdir -p dist && cp dl/*.ipk dist/
      - run: sh scripts/smoke-test.sh dist/*.ipk

  sdk:
    name: SDK 编译验证 ${{ matrix.arch }}（${{ matrix.ver }}）
    needs: [ prepare, package ]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            board: x86
            subtarget: '64'
            ver: 25.12.2
          - arch: aarch64_cortex-a53
            board: airoha
            subtarget: an7581
            ver: snapshot
    env:
      IMMORTALWRT_VER: ${{ matrix.ver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipk-${{ matrix.arch }}
          path: dl
      - name: 放入预编译二进制
        run: |
          set -e
          mkdir -p "openwrt/prebuilt/${{ matrix.arch }}"
          cp "dl/deskgw-${{ matrix.arch }}.tar.gz" "openwrt/prebuilt/${{ matrix.arch }}/"
      - name: 下载 ImmortalWrt SDK
        run: sh scripts/fetch-sdk.sh "${{ matrix.board }}" "${{ matrix.subtarget }}" sdk
      - name: 在 SDK 里编译这个包
        run: |
          set -eo pipefail
          cp -r openwrt sdk/package/deskgw
          cd sdk
          make defconfig
          make package/deskgw/compile V=s \
            PKG_VERSION="${{ needs.prepare.outputs.version }}" \
            -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log" | tail -80
      - name: 检查产物
        run: |
          set -e
          mkdir -p sdkout
          find sdk/bin -name 'deskgw*.apk' -exec cp {} sdkout/ \; || true
          find sdk/bin -name 'deskgw*.ipk' -exec cp {} sdkout/ \; || true
          for f in sdkout/*.apk; do
            [ -e "$f" ] || continue
            mv "$f" "${f%.apk}_${{ matrix.arch }}.apk"
          done
          ls -l sdkout
          pkg=$(ls sdkout/* 2>/dev/null | head -1)
          [ -n "$pkg" ] || { echo "::error::SDK 没有产出包"; exit 1; }
          case "$pkg" in
            *.ipk)
              arch=$(ar p "$pkg" control.tar.gz | tar xzO ./control | sed -n 's/^Architecture: //p') ;;
            *.apk)
              arch=$(grep -ao 'info "arch:[^"]*' build.log | head -1 | sed 's/.*arch://') ;;
          esac
          echo "产物: $pkg arch=$arch"
          [ "$arch" = "${{ matrix.arch }}" ] || {
            echo "::error::Architecture 是 $arch"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.arch }}
          path: sdkout/*
          if-no-files-found: error

  release:
    name: 发布
    needs: [ prepare, package, smoke, sdk ]
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ipk-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          merge-multiple: true
          path: dist
      - name: 列出产物
        run: ls -l dist
      - name: 决定 tag
        id: rel
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"; pre=false
          elif [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            tag="weekly"; pre=true
          else
            tag="v${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.short }}"; pre=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pre=$pre" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: deskgw ${{ needs.prepare.outputs.version }} (${{ needs.prepare.outputs.short }})
          prerelease: ${{ steps.rel.outputs.pre }}
          make_latest: false
          files: |
            dist/*.ipk
            dist/*.apk
            dist/deskgw-*.tar.gz
            dist/deskgw-*.sha256
          body: |
            版本：${{ needs.prepare.outputs.version }} @ ${{ needs.prepare.outputs.short }}
            范围：性能模式接入层（Airhand 被控端 QUIC 接入、信令握手、待批准列表）

            | 文件 | 用途 |
            |---|---|
            | `*.ipk` | OpenWrt / ImmortalWrt 24.10（opkg） |
            | `*.apk` | ImmortalWrt 25.12 / snapshot（apk），an7581 只能用这个 |
            | `deskgw-<arch>.tar.gz` | `openwrt/Makefile` 的二进制来源 |
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: bin
          name: 预编译二进制（供 openwrt/Makefile 下载）
          prerelease: true
          make_latest: false
          files: |
            dist/deskgw-*.tar.gz
            dist/deskgw-*.sha256
          body: |
            滚动更新的预编译二进制，供 `openwrt/Makefile` 的 `Build/Prepare` 使用。
            来源：${{ needs.prepare.outputs.version }} @ ${{ needs.prepare.outputs.short }}

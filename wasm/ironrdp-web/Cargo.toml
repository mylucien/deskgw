[package]
name = "ironrdp-web"
version = "0.17.0-deskgw.2"
readme = "README.md"
description = "WebAssembly high-level bindings targeting web browsers (patched for direct TLS)"
publish = false
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Devolutions/IronRDP"
repository = "https://github.com/Devolutions/IronRDP"
authors = ["Devolutions Inc. <infos@devolutions.net>"]
keywords = ["rdp", "remote-desktop", "wasm"]
categories = ["network-programming"]

[lib]
doctest = false
test = false
crate-type = ["cdylib", "rlib"]

[features]
default = ["panic_hook"]
panic_hook = ["iron-remote-desktop/panic_hook"]
qoi = ["ironrdp/qoi"]
qoiz = ["ironrdp/qoiz"]

[dependencies]
# Protocols，版本与 ironrdp-v0.17.0 的 Cargo.lock 一致。
ironrdp = { version = "=0.17.0", features = [
    "connector",
    "session",
    "input",
    "graphics",
    "dvc",
    "cliprdr",
    "rdpdr",
    "rdpsnd",
    "svc",
    "displaycontrol",
    "pdu",
] }
ironrdp-core = "=0.2.1"
ironrdp-cliprdr-format = "=0.2.0"
ironrdp-futures = "=0.8.0"
ironrdp-pdu = "=0.9.0"
ironrdp-propertyset = "=0.1.0"
ironrdp-rdpfile = "=0.1.0"
ironrdp-svc = "=0.8.0"
iron-remote-desktop.path = "../iron-remote-desktop"

# TLS：浏览器自己与 Windows 协商，网关不参与解密。
# futures-rustls 关掉了 rustls 的默认特性又透传不了 std，而 rustls 的 Ticketer
# 需要 UnixTime::now()，所以这里显式把 rustls 的 std 打开（同一个 crate，特性合并）。
futures-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# wasm32-unknown-unknown 上 pki-types 不会用 std 提供 UnixTime::now()，
# 必须开 web 特性（改走 JS 时钟），否则 rustls 的 Ticketer 编译不过。
rustls-pki-types = { version = "1", features = ["web"] }
# wasm32-unknown-unknown 上 ring 必须启用 JS 随机源，否则 SystemRandom
# 不实现 SecureRandom，rustls 的签名路径直接编译失败。
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "ImageData",
    "Navigator",
    "Performance",
    "Window",
] }
js-sys = "0.3"
gloo-net = { version = "0.7", default-features = false, features = ["websocket", "http", "io-util"] }
gloo-timers = { version = "0.4", default-features = false, features = ["futures"] }

# Rendering
png = "0.18"
resize = { version = "0.8", features = ["std"], default-features = false }
rgb = "0.8"

# Enable WebAssembly support for a few crates
getrandom2 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] } # sspi/picky transitive dep
chrono = { version = "0.4", features = ["wasmbind"] }
time = { version = "0.3", features = ["wasm-bindgen"] }

# Async
futures-util = { version = "0.3", features = ["sink", "io"] }
futures-channel = "0.3"

# Logging
tracing = { version = "0.1", features = ["log"] }

# Utils
anyhow = "1"
smallvec = "1.15"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
tap = "1"
semver = "1"
url = "2.5"
base64 = "0.22"
